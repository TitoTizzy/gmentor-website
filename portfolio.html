<!doctype html>
<html lang="fr" data-theme="dark" data-site="unified" data-locale="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio interactif de Marie Gaëlle Mentor réunissant ses projets en Haïti et aux États-Unis.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <title>Portfolio | Marie Gaëlle Mentor</title>
</head>
<body data-root="." data-page="portfolio">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="site-header" data-site-header></header>
  <main id="main" class="portfolio-shell">
    <header class="portfolio-heading container">
      <div><p class="eyebrow" data-book-label>Haïti · États-Unis</p><h1 data-book-title>L'architecture au-delà des frontières.</h1></div>
      <p data-book-intro>Photos, rendus et plans réunis dans un livre interactif.</p>
    </header>
    <section class="book-stage" data-book-stage aria-label="Portfolio interactif">
      <div class="book-toolbar" aria-label="Commandes du portfolio">
        <button class="icon-button" type="button" data-book-prev title="Page précédente" aria-label="Page précédente">←</button>
        <span class="book-counter" data-book-counter aria-live="polite">1 / 1</span>
        <button class="icon-button" type="button" data-book-next title="Page suivante" aria-label="Page suivante">→</button>
        <button class="icon-button" type="button" data-book-fullscreen title="Plein écran" aria-label="Afficher le portfolio en plein écran">⛶</button>
      </div>
      <div class="portfolio-book" data-portfolio-book></div>
    </section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <script src="js/data.js" defer></script>
  <script src="js/vendor/page-flip.browser.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/portfolio.js" defer></script>
</body>
</html>
