<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Marie Gaelle Mentor - Architectural Designer</title>
  <desc id="logo-description">Logo MGM architectural cuivre, orange et noir, avec la signature Spaces That Inspire A Better Tomorrow.</desc>

  <defs>
    <linearGradient id="orangeTower" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#ff9a22"/>
      <stop offset="0.52" stop-color="#ff7800"/>
      <stop offset="1" stop-color="#9a3600"/>
    </linearGradient>
    <linearGradient id="bronzeTower" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#6d3514"/>
      <stop offset="0.48" stop-color="#b9824d"/>
      <stop offset="1" stop-color="#552208"/>
    </linearGradient>
    <linearGradient id="lightBronze" x1="0" y1="0.25" x2="1" y2="0.8">
      <stop offset="0" stop-color="#e2b984"/>
      <stop offset="0.55" stop-color="#9a5727"/>
      <stop offset="1" stop-color="#5e280c"/>
    </linearGradient>
    <linearGradient id="roofOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9423"/>
      <stop offset="0.55" stop-color="#ef6d00"/>
      <stop offset="1" stop-color="#8d2c00"/>
    </linearGradient>
    <linearGradient id="warmBlack" x1="0" y1="0" x2="1" y2="0.75">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.48" stop-color="#26231d"/>
      <stop offset="0.76" stop-color="#171713"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0.15" x2="1" y2="0.82">
      <stop offset="0" stop-color="#e7c298"/>
      <stop offset="0.42" stop-color="#bd8144"/>
      <stop offset="0.72" stop-color="#8b4a1d"/>
      <stop offset="1" stop-color="#522308"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dx="3" dy="5" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#fdfcfb"/>

  <g filter="url(#softShadow)">
    <!-- Architectural skyline -->
    <path d="M326 625V466L477 360V498L326 625Z" fill="url(#lightBronze)"/>
    <path d="M492 524V355" fill="none" stroke="#6f2b08" stroke-width="4"/>

    <path d="M492 353V202L584 133V490L539 499V320L492 354Z" fill="url(#orangeTower)"/>
    <path d="M597 171L689 248V354L636 326V491L597 483V171Z" fill="url(#bronzeTower)"/>
    <path d="M704 258V389" fill="none" stroke="#682300" stroke-width="4"/>

    <path d="M655 381L1044 573L1031 593L655 425V381Z" fill="url(#roofOrange)"/>
    <path d="M874 511V631" fill="none" stroke="#bd4b00" stroke-width="3"/>
    <path d="M990 461V555" fill="none" stroke="#632000" stroke-width="3"/>
    <path d="M1034 555L1087 582" fill="none" stroke="#652000" stroke-width="3"/>

    <!-- MGM monogram -->
    <path d="M174 777V537L304 668L477 505V777H425V632L304 739L232 669V777H174Z" fill="url(#warmBlack)"/>
    <path d="M723 777V495L875 663L991 552V777H939V664L874 729L776 632V777H723Z" fill="url(#warmBlack)"/>

    <!-- Geometric G -->
    <path fill="url(#goldG)" fill-rule="evenodd" d="M591 489C492 489 414 563 414 654C414 748 492 790 588 790C691 790 751 728 754 633H592V683H690C676 720 641 742 591 742C522 742 470 707 470 650C470 591 520 540 591 540C637 540 674 559 696 591H756C730 526 671 489 591 489ZM588 556C536 556 500 593 500 648C500 702 537 726 589 726C615 726 638 718 652 704H575V617H788V653C788 766 710 825 590 825C456 825 362 757 362 653C362 541 461 456 591 456C686 456 762 500 800 577H681C660 563 629 556 588 556Z"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="882" fill="#090909" text-anchor="middle"
        font-family="Montserrat, Avenir Next, Century Gothic, Arial, sans-serif"
        font-size="55" font-weight="400" letter-spacing="13">MARIE GAELLE MENTOR</text>

  <!-- Profession line -->
  <line x1="94" y1="924" x2="215" y2="924" stroke="#ed7200" stroke-width="4"/>
  <text x="600" y="938" fill="#77411e" text-anchor="middle"
        font-family="Montserrat, Avenir Next, Century Gothic, Arial, sans-serif"
        font-size="33" font-weight="400" letter-spacing="10">ARCHITECTURAL DESIGNER</text>
  <line x1="985" y1="924" x2="1136" y2="924" stroke="#ed7200" stroke-width="4"/>

  <!-- Signature -->
  <text x="600" y="1007" fill="#76553f" text-anchor="middle"
        font-family="Montserrat, Avenir Next, Century Gothic, Arial, sans-serif"
        font-size="23" font-weight="400" letter-spacing="8">SPACES THAT INSPIRE A BETTER TOMORROW</text>
</svg>
