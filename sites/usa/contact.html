<!doctype html>
<html lang="en" data-theme="dark" data-market="us" data-locale="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Tell Marie Gaëlle Mentor about your project."><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/styles.css"><title>Contact | Marie Gaëlle Mentor</title></head>
<body data-root="." data-page="contact"><a class="skip-link" href="#main">Skip to content</a><header class="site-header" data-site-header></header>
<main id="main"><div class="page-shell container"><header class="page-intro"><p class="eyebrow">Contact</p><div><h1>Let's discuss your project.</h1><p>Share the essential details of your project. No appointment or budget selection is required.</p></div></header>
  <section class="contact-grid"><aside><p class="eyebrow">Get in touch</p><h2>United States</h2><p>Final professional contact details will be displayed after validation.</p></aside>
  <form class="contact-form" data-contact-form><div class="field"><label for="fullName">Full name *</label><input id="fullName" name="fullName" autocomplete="name" required></div><div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required></div><div class="field"><label for="country">Country *</label><input id="country" name="country" required></div><div class="field"><label for="city">City *</label><input id="city" name="city" required></div><div class="field"><label for="projectType">Project type *</label><select id="projectType" name="projectType" required><option value="">Select</option><option>Architectural design</option><option>Interior design</option><option>Renovation</option><option>3D visualization</option></select></div><div class="field span-2"><label for="description">Project description</label><textarea id="description" name="description"></textarea></div><label class="checkbox span-2"><input type="checkbox" name="usesWhatsapp"><span>This number uses WhatsApp</span></label><label class="checkbox span-2"><input type="checkbox" name="privacy" required><span>Acceptance of the <a class="text-link" href="privacy.html">privacy policy</a> *</span></label><p class="form-status span-2" data-form-status aria-live="polite"></p><div class="span-2"><button class="button button-primary" type="submit">Send request</button></div></form></section>
</div></main><footer class="site-footer" data-site-footer></footer><script src="js/data.js" defer></script><script src="js/app.js" defer></script></body></html>
