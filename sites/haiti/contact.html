<!doctype html>
<html lang="fr" data-theme="dark" data-market="global" data-locale="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Présentez votre projet à Marie Gaëlle Mentor."><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/styles.css"><title>Contact | Marie Gaëlle Mentor</title></head>
<body data-root="." data-page="contact"><a class="skip-link" href="#main">Aller au contenu</a><header class="site-header" data-site-header></header>
<main id="main"><div class="page-shell container"><header class="page-intro"><p class="eyebrow">Contact</p><div><h1>Parlons de votre projet.</h1><p>Partagez les informations essentielles. Aucune sélection de rendez-vous ou de budget n’est demandée.</p></div></header>
  <section class="contact-grid"><aside><p class="eyebrow">Prise de contact</p><h2>États-Unis et Haïti</h2><p>Les coordonnées professionnelles définitives seront affichées après validation.</p></aside>
  <form class="contact-form" data-contact-form><div class="field"><label for="fullName">Nom complet *</label><input id="fullName" name="fullName" autocomplete="name" required></div><div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="phone">Téléphone *</label><input id="phone" name="phone" type="tel" required></div><div class="field"><label for="country">Pays *</label><input id="country" name="country" required></div><div class="field"><label for="city">Ville *</label><input id="city" name="city" required></div><div class="field"><label for="projectType">Type de projet *</label><select id="projectType" name="projectType" required><option value="">Choisir</option><option>Conception architecturale</option><option>Design intérieur</option><option>Rénovation</option><option>Rendus et modélisation 3D</option></select></div><div class="field span-2"><label for="description">Description du projet</label><textarea id="description" name="description"></textarea></div><label class="checkbox span-2"><input type="checkbox" name="usesWhatsapp"><span>Ce numéro utilise WhatsApp</span></label><label class="checkbox span-2"><input type="checkbox" name="privacy" required><span>Acceptation de la <a class="text-link" href="privacy.html">politique de confidentialité</a> *</span></label><p class="form-status span-2" data-form-status aria-live="polite"></p><div class="span-2"><button class="button button-primary" type="submit">Envoyer la demande</button></div></form></section>
</div></main><footer class="site-footer" data-site-footer></footer><script src="js/data.js" defer></script><script src="js/app.js" defer></script></body></html>
